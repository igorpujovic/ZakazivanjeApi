<!--
  The shop's pole, in a 32px square: brass caps, striped glass, on the navy of the shopfront.
  The same drawing as `src/ui/Logo.tsx`, written out separately because a favicon is a file the
  browser fetches on its own and cannot import anything.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <pattern id="stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="10" height="10" fill="#ffffff" />
      <rect width="4" height="10" fill="#b33029" />
      <rect x="6" width="4" height="10" fill="#1f3b4d" />
    </pattern>
    <clipPath id="body">
      <rect x="11" y="6" width="10" height="20" rx="2" />
    </clipPath>
  </defs>

  <rect width="32" height="32" rx="7" fill="#1f3b4d" />

  <g clip-path="url(#body)">
    <rect x="11" y="6" width="10" height="20" fill="url(#stripes)" />
  </g>

  <rect x="9" y="3.5" width="14" height="4" rx="1.6" fill="#b08043" />
  <rect x="9" y="24.5" width="14" height="4" rx="1.6" fill="#b08043" />
</svg>
